services:
  db:
    image: postgres:16-alpine
    container_name: signaflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signaflow_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-signaflow_db}
    ports:
      - "5432:5432"
    volumes:
      - signaflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signaflow} -d ${POSTGRES_DB:-signaflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signaflow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-signaflow}:${POSTGRES_PASSWORD:-signaflow_secret_2026}@db:5432/${POSTGRES_DB:-signaflow_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ganti_dengan_64_karakter_acak_untuk_produksi_signaflow_2026_pkl}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@signaflow.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-AdminSignaFlow2026!}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MEDIA_UPLOAD_DIR: /app/uploads
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-/media}
      VENUE_TIMEZONE: ${VENUE_TIMEZONE:-Asia/Jakarta}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://localhost}
    volumes:
      - signaflow_media:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  proxy:
    image: caddy:2-alpine
    container_name: signaflow-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - signaflow_media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  signaflow_pgdata:
  signaflow_media:
  caddy_data:
  caddy_config:
